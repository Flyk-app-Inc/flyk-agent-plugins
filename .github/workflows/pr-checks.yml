name: pr-checks

# Gates specific to this being a Claude plugin marketplace: every PR must
# ship valid manifests, clean markdown, a bumped plugin version if a plugin
# changed, and no secrets. Fast tests (unit/integration) live in test.yml —
# this workflow is about repo/release hygiene, not test coverage.

on:
  pull_request:

permissions:
  contents: read

jobs:
  json-validate:
    name: JSON manifests parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every JSON file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; status=1; }
          done < <(find . -name "*.json" -not -path "./.git/*" -print0)
          exit "$status"

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Config: .markdownlint-cli2.jsonc at repo root
      - run: npx --yes markdownlint-cli2 "**/*.md"

  version-bump-check:
    name: Changed plugins bumped their version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 .github/scripts/check_version_bump.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately (not resolved from the GitHub API at run time):
      # an unauthenticated "latest release" lookup is rate-limited per
      # runner IP and makes the gate non-reproducible across PRs. Bump this
      # in its own PR when you want a newer gitleaks/ruleset.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan the PR's commit range
        # --log-opts scans git history for this range, not just the final
        # working tree, so a secret added then removed earlier in the same
        # PR is still caught (fetch-depth: 0 above is what makes this
        # range resolvable).
        run: |
          gitleaks detect --source . \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact -v
